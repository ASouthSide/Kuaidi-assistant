name: Android build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew --no-daemon testSideloadDebugUnitTest testStoreDebugUnitTest assembleSideloadDebug assembleStoreDebug assembleSideloadRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-apks
          path: app/build/outputs/apk/*/*/*.apk
          if-no-files-found: error

