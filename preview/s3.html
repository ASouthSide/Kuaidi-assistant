<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="showcase.css"></head>
<body>
  <div class="card">
    <div class="phone"><div class="phone-inner">
      <div class="title-bar"><div class="title">快递助手</div><div class="subtitle">手动添加</div></div>
      <div class="btn-row"><div class="btn">手动添加</div><div class="btn">粘贴短信</div><div class="btn">图片识别</div></div>
      <div class="sec"><span class="sec-title">取件区</span></div>
      <div class="overlay" style="align-items:flex-start;padding-top:40px">
        <div class="dialog">
          <div class="dlg-title">手动添加快件</div>
          <div class="field"><div class="field-label">取件码 *</div><div class="field-input blue">7-3-3001</div></div>
          <div class="field"><div class="field-label">取件点</div><div class="field-input">XX校区多多驿站</div></div>
          <div class="field"><div class="field-label">详细地址</div><div class="field-input">XX快递服务中心一楼</div></div>
          <div class="field"><div class="field-label">快递公司</div><div class="field-input">圆通</div></div>
          <div class="dlg-actions"><div class="dlg-btn">取消</div><div class="dlg-btn primary">添加</div></div>
        </div>
      </div>
    </div></div>
    <div class="caption">④ 手动添加：填取件码/取件点/地址/快递</div>
  </div>

  <div class="card">
    <div class="phone"><div class="phone-inner">
      <div class="title-bar"><div class="title">快递助手</div><div class="subtitle">粘贴短信自动解析</div></div>
      <div class="btn-row"><div class="btn">手动添加</div><div class="btn">粘贴短信</div><div class="btn">图片识别</div></div>
      <div class="sec"><span class="sec-title">取件区</span></div>
      <div class="overlay" style="align-items:flex-start;padding-top:40px">
        <div class="dialog">
          <div class="dlg-title">粘贴短信自动解析</div>
          <div style="margin:6px 16px;border:1.5px solid #D0D4DC;border-radius:8px;padding:10px;font-size:11.5px;line-height:1.8;color:#3A4150;">
            【兔喜生活】您有包裹已到达XX校区中通店，取件码为11-6-05002，地址:XX学院体育场东门
          </div>
          <div style="margin:0 16px;font-size:10.5px;color:#3B6EF7;line-height:1.8;">
            识别结果：码 11-6-05002 · 点 XX校区中通店 · 中通
          </div>
          <div class="dlg-actions"><div class="dlg-btn">取消</div><div class="dlg-btn primary">解析并添加</div></div>
        </div>
      </div>
    </div></div>
    <div class="caption">⑤ 粘贴短信：自动解析取件码</div>
  </div>
</body></html>
