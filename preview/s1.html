<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="showcase.css"></head>
<body>
  <div class="card">
    <div class="phone" style="height:900px"><div class="phone-inner">
      <div class="title-bar"><div class="title">快递助手</div><div class="subtitle">自动识别快递短信 · 取件管理 · v1.8</div></div>
      <div class="filter-row">
        <div class="filter-col"><div class="filter-label">日期</div><div class="spinner"><span class="val">全部</span><span class="arrow">▼</span></div></div>
        <div class="filter-col"><div class="filter-label">快递</div><div class="spinner"><span class="val">全部</span><span class="arrow">▼</span></div></div>
        <div class="filter-col"><div class="filter-label">地址</div><div class="spinner"><span class="val">全部</span><span class="arrow">▼</span></div></div>
      </div>
      <div class="btn-row"><div class="btn">手动添加</div><div class="btn">粘贴短信</div><div class="btn">图片识别</div></div>
      <div class="btn-row" style="padding-bottom:2px"><div class="btn">身份码</div><div class="btn">地址管理</div><div class="btn">设置</div></div>
      <div class="sec"><span class="sec-title">取件区</span><span class="sec-count">共 3 件</span><span class="sec-arrow">▾</span></div>
      <div class="pkg">
        <div class="pkg-top"><span class="loc">XX校区多多驿站</span><span class="tag unpicked">未取</span></div>
        <div class="code">取件码 7-3-3001</div>
        <div class="addr">地址：XX快递服务中心一楼</div>
        <div class="meta">圆通 · 今天 09:12</div>
        <div class="pkg-actions"><span class="act primary">取件</span><span class="act">删除</span></div>
      </div>
      <div class="pkg">
        <div class="pkg-top"><span class="loc">XX小区2号柜</span><span class="tag unpicked">未取</span></div>
        <div class="code">取件码 575001</div>
        <div class="meta">中通 · 昨天 18:40</div>
        <div class="pkg-actions"><span class="act primary">取件</span><span class="act">删除</span></div>
      </div>
      <div class="jump-area" style="position:static;margin:8px;">
        <div class="jump-header-row"><span class="jump-title">跳转区</span><span class="trash">🗑</span><span style="font-size:11px;color:#8A90A0;">▾</span></div>
        <div class="grid">
          <div class="cell">拼多多</div><div class="cell">淘宝</div>
          <div class="cell">抖音</div><div class="cell">京东</div>
        </div>
        <div class="addbar">＋ 添加应用</div>
      </div>
    </div></div>
    <div class="caption">① 首页总览：筛选 + 快速操作 + 取件区 + 跳转区</div>
  </div>
</body></html>
