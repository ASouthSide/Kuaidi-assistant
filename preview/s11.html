<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="showcase.css">
<style>
  .frosted {
    width: 100%; border-radius: 20px; overflow: hidden;
    background: rgba(255,255,255,.90);
    border: 1px solid rgba(255,255,255,.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 34px rgba(0,0,0,.28);
    display: flex; flex-direction: column;
  }
  .f-title { font-size: 15px; font-weight: 700; padding: 14px 18px 6px; color: #1F2430; }
  .f-item { padding: 12px 18px; font-size: 13px; color: #3A4150; border-top: 1px solid rgba(0,0,0,.06); }
  .f-actions { display: flex; justify-content: flex-end; padding: 8px 12px 12px; }
  .f-btn { font-size: 13.5px; font-weight: 600; color: #3B6EF7; padding: 7px 13px; }
  .f-btn.primary { background: #EAF0FF; border-radius: 8px; }
  .f-input { margin: 6px 18px; border: 1.5px solid #3B6EF7; border-radius: 9px; padding: 9px 11px; font-size: 13px; color: #1F2430; background: rgba(255,255,255,.8); }
  .f-label { font-size: 10px; color: #8A90A0; margin: 8px 18px 0; }
  .frost-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.42); display: flex; align-items: center; justify-content: center; padding: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="phone" style="height:700px"><div class="phone-inner">
      <div class="title-bar"><div class="title">快递助手</div><div class="subtitle">圆角磨砂弹窗 · 手动添加</div></div>
      <div class="btn-row"><div class="btn">手动添加</div><div class="btn">粘贴短信</div><div class="btn">图片识别</div></div>
      <div class="sec"><span class="sec-title">取件区</span></div>
      <div class="frost-overlay">
        <div class="frosted">
          <div class="f-title">手动添加快件</div>
          <div class="f-label">取件码 *</div>
          <div class="f-input">7-3-3001</div>
          <div class="f-label">取件点</div>
          <div class="f-input">XX校区多多驿站</div>
          <div class="f-label">快递公司</div>
          <div class="f-input">圆通</div>
          <div class="f-actions"><div class="f-btn">取消</div><div class="f-btn primary">添加</div></div>
        </div>
      </div>
    </div></div>
    <div class="caption">圆角 + 透明磨砂（输入类弹窗）</div>
  </div>

  <div class="card">
    <div class="phone" style="height:700px"><div class="phone-inner">
      <div class="title-bar"><div class="title">快递助手</div><div class="subtitle">圆角磨砂弹窗 · 选项</div></div>
      <div class="btn-row"><div class="btn">身份码</div><div class="btn">地址管理</div><div class="btn">设置</div></div>
      <div class="sec"><span class="sec-title">取件区</span></div>
      <div class="frost-overlay">
        <div class="frosted">
          <div class="f-title">淘宝</div>
          <div class="f-item">启动淘宝</div>
          <div class="f-item">身份码</div>
          <div class="f-actions"><div class="f-btn">取消</div></div>
        </div>
      </div>
    </div></div>
    <div class="caption">圆角 + 透明磨砂（选项类弹窗）</div>
  </div>
</body></html>
