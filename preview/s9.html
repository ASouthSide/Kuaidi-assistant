<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="showcase.css"></head>
<body>
  <div class="card">
    <div class="phone"><div class="phone-inner">
      <div class="title-bar"><div class="title">快递助手</div><div class="subtitle">超期未取 · 本地通知</div></div>
      <div class="note">
        <div class="note-row">
          <div class="note-icon">📦</div>
          <div style="flex:1">
            <div class="note-title">包裹超期未取（2 件）</div>
            <div style="font-size:10px;color:#9AA1AE;margin-top:2px;">快递助手 · 刚刚</div>
          </div>
        </div>
        <div class="note-body">
          · XX校区多多驿站　取件码 7-3-3001<br>
          · XX校区菜鸟驿站　取件码 105-3-7014
        </div>
      </div>
      <div class="sec"><span class="sec-title">取件区</span></div>
      <div class="pkg">
        <div class="pkg-top"><span class="loc">XX校区多多驿站</span><span class="tag unpicked">未取</span></div>
        <div class="code">取件码 7-3-3001</div>
        <div class="overdue-text">⚠ 已超 4 天未取</div>
      </div>
      <div style="margin:14px 12px;font-size:11px;color:#8A90A0;line-height:1.9;">
        未取且超过设定天数时，自动本地通知提醒，避免超时取件。
      </div>
    </div></div>
    <div class="caption">⑭ 超期提醒：超过天数自动通知</div>
  </div>

  <div class="card">
    <div class="phone"><div class="phone-inner">
      <div class="title-bar"><div class="title">快递助手</div><div class="subtitle">高级设置</div></div>
      <div class="btn-row"><div class="btn">身份码</div><div class="btn">地址管理</div><div class="btn" style="background:#2454D6">设置</div></div>
      <div class="sec"><span class="sec-title">取件区</span></div>
      <div class="overlay" style="align-items:flex-start;padding-top:50px">
        <div class="dialog">
          <div class="dlg-title">高级设置</div>
          <div style="padding:8px 16px;font-size:12px;line-height:2;color:#3A4150;">
            <div>☑ 点击取件时自动打开淘宝身份码</div>
            <div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;">
              <span>超期提醒天数</span>
              <span style="border:1px solid #D0D4DC;border-radius:6px;padding:3px 10px;color:#3B6EF7;">4 天 ▾</span>
            </div>
          </div>
          <div class="dlg-actions"><div class="dlg-btn">取消</div><div class="dlg-btn primary">保存</div></div>
        </div>
      </div>
    </div></div>
    <div class="caption">⑮ 高级设置：取件联动 / 超期天数</div>
  </div>
</body></html>
