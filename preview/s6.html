<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="showcase.css"></head>
<body>
  <div class="card">
    <div class="phone"><div class="phone-inner">
      <div class="title-bar"><div class="title">快递助手</div><div class="subtitle">按日期 / 快递 / 地址筛选</div></div>
      <div class="filter-row">
        <div class="filter-col"><div class="filter-label">日期</div><div class="spinner"><span class="val" style="color:#3B6EF7;font-weight:700">近3天</span><span class="arrow">▼</span></div></div>
        <div class="filter-col"><div class="filter-label">快递</div><div class="spinner"><span class="val" style="color:#3B6EF7;font-weight:700">圆通</span><span class="arrow">▼</span></div></div>
        <div class="filter-col"><div class="filter-label">地址</div><div class="spinner"><span class="val">全部</span><span class="arrow">▼</span></div></div>
      </div>
      <div class="sec"><span class="sec-title">取件区</span><span class="sec-count">共 1 件</span><span class="sec-arrow">▾</span></div>
      <div class="pkg">
        <div class="pkg-top"><span class="loc">XX校区多多驿站</span><span class="tag unpicked">未取</span></div>
        <div class="code">取件码 7-3-3001</div>
        <div class="addr">地址：XX快递服务中心一楼</div>
        <div class="meta">圆通 · 今天 09:12</div>
      </div>
      <div style="margin:14px 12px;font-size:11px;color:#8A90A0;line-height:1.9;">
        筛选条件可组合：<br>
        日期（全部 / 今天 / 近3天 / 近7天）<br>
        快递（全部 / 各快递公司）<br>
        地址（全部 / 各取件点）
      </div>
    </div></div>
    <div class="caption">⑨ 组合筛选：日期 + 快递 + 地址</div>
  </div>

  <div class="card">
    <div class="phone"><div class="phone-inner">
      <div class="title-bar"><div class="title">快递助手</div><div class="subtitle">地址管理</div></div>
      <div class="btn-row"><div class="btn">身份码</div><div class="btn" style="background:#2454D6">地址管理</div><div class="btn">设置</div></div>
      <div class="sec"><span class="sec-title">取件区</span></div>
      <div class="overlay" style="align-items:flex-start;padding-top:40px">
        <div class="dialog">
          <div class="dlg-title">地址管理（重命名取件点）</div>
          <div class="dlg-item"><span>XX校区多多驿站</span><span class="pkg">重命名</span></div>
          <div class="dlg-item"><span>XX校区菜鸟驿站</span><span class="pkg">重命名</span></div>
          <div class="dlg-item"><span>XX小区2号柜</span><span class="pkg">重命名</span></div>
          <div class="dlg-actions"><div class="dlg-btn">完成</div></div>
        </div>
      </div>
    </div></div>
    <div class="caption">⑩ 地址管理：取件点可自定义名称</div>
  </div>
</body></html>
